version: '3.8'

services:
  # 1. Database (SQL Server)
  webstore-db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: webstore_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=WebStorePassword2026
    ports:
      - "1443:1433"
    volumes:
      - mssql_data:/var/opt/mssql'
    

  # 2. RabbitMQ
  webstore-rabbitmq:
    image: rabbitmq:3-management
    container_name: webstore_rabbitmq
    command: rabbitmq-server --rabbit vm_memory_high_watermark 0.6
    ports:
      - "5672:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  # 3. Catalog API
  catalog-api:
    image: catalog-api:latest
    build:
      context: .
      dockerfile: WebStore.CatalogAPI/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__Default=Server=webstore-db;Database=CatalogDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - ConnectionStrings__HangFireConnection=Server=webstore-db;Database=HangfireDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - RabbitMQ__Host=webstore-rabbitmq
    depends_on:
      - webstore-db

  # 4. Cart API
  cart-api:
    image: cart-api:latest
    build:
      context: .
      dockerfile: WebStore.CartAPI/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__Default=Server=webstore-db;Database=CartDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - ConnectionStrings__HangFireConnection=Server=webstore-db;Database=HangfireDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - RabbitMQ__Host=webstore-rabbitmq
    depends_on:
      - webstore-db

  # 5. Order API
  order-api:
    image: order-api:latest
    build:
      context: .
      dockerfile: WebStore.OrderAPI/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ConnectionStrings__Default=Server=webstore-db;Database=OrderDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - ConnectionStrings__HangFireConnection=Server=webstore-db;Database=HangfireDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - RabbitMQ__Host=webstore-rabbitmq
    depends_on:
      - webstore-db

  # 6. User API
  user-api:
    image: user-api:latest
    build:
      context: .
      dockerfile: WebStore.UserAPI/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ConnectionStrings__Default=Server=webstore-db;Database=UserDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - ConnectionStrings__HangFireConnection=Server=webstore-db;Database=HangfireDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - RabbitMQ__Host=webstore-rabbitmq
    depends_on:
      - webstore-db

  # 7. BackWorker
  back-worker:
    image: back-worker:latest
    build:
      context: .
      dockerfile: WebStore.BackWorker/Dockerfile
    environment:
      - ConnectionStrings__Default=Server=webstore-db;Database=HangfireDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - ConnectionStrings__UserDb=Server=webstore-db;Database=UserDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - ConnectionStrings__CartDb=Server=webstore-db;Database=CartDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - ConnectionStrings__OrderDb=Server=webstore-db;Database=OrderDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - ConnectionStrings__CatalogDb=Server=webstore-db;Database=CatalogDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;
      - RabbitMQ__Host=webstore-rabbitmq
      - DOTNET_OUTPUT_BUFFERING=0

      - Email__SmtpServer=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__FromAddress=knindustrybank@gmail.com
      - Email__Password=mhwg rwoe bkek svhs
    depends_on:
      - webstore-db
      - webstore-rabbitmq

  #Migrations
  catalog-db-migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    deploy:
      resources:
        limits:
          memory: 1gb
    container_name: catalog_db_migrator
    volumes:
      - .:/src
    working_dir: /src
    depends_on:
      - webstore-db
    command: >
      bash -c "
      dotnet tool install --global dotnet-ef --version 8.0.0 &&
      export PATH=\"$$PATH:/root/.dotnet/tools\" &&
      dotnet ef database update --no-build --project Webstore.CatalogInfrastructure/Webstore.CatalogInfrastructure.csproj --startup-project WebStore.CatalogAPI/WebStore.CatalogAPI.csproj --connection 'Server=webstore-db,1433;Database=CatalogDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;'"
    
  user-db-migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: user_db_migrator
    volumes:
      - .:/src
    working_dir: /src
    depends_on:
      - webstore-db
    command: >
      bash -c "
      dotnet tool install --global dotnet-ef --version 8.0.0 &&
      export PATH=\"$$PATH:/root/.dotnet/tools\" &&
      dotnet ef database update --no-build --project Webstore.UserInfrastructure/Webstore.UserInfrastructure.csproj --startup-project WebStore.UserAPI/WebStore.UserAPI.csproj --connection 'Server=webstore-db,1433;Database=UserDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;'"

  cart-db-migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: cart_db_migrator
    volumes:
      - .:/src
    working_dir: /src
    depends_on:
      - webstore-db
    command: >
      bash -c "
      dotnet tool install --global dotnet-ef --version 8.0.0 &&
      export PATH=\"$$PATH:/root/.dotnet/tools\" &&
      dotnet ef database update --no-build --project CartInfrastructure/WebStore.CartInfrastructure.csproj --startup-project WebStore.CartAPI/WebStore.CartAPI.csproj --connection 'Server=webstore-db,1433;Database=CartDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;'"
  
  order-db-migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: order_db_migrator
    volumes:
      - .:/src
    working_dir: /src
    depends_on:
      - webstore-db
    command: >
      bash -c "
      dotnet tool install --global dotnet-ef --version 8.0.0 &&
      export PATH=\"$$PATH:/root/.dotnet/tools\" &&
      dotnet ef database update --no-build --project Webstore.OrderInfrastructure/Webstore.OrderInfrastructure.csproj --startup-project WebStore.OrderAPI/WebStore.OrderAPI.csproj --connection 'Server=webstore-db,1433;Database=OrderDb;User Id=sa;Password=WebStorePassword2026;TrustServerCertificate=True;'"

volumes:
  mssql_data:



  